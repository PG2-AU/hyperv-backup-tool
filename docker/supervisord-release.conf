; Release-Image (docker/Dockerfile.release): kein Updater-Prozess, Python aus /opt/venv.
[supervisord]
nodaemon=true
logfile=/var/log/hvnb/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:uvicorn]
directory=/opt/app/backend
command=/opt/venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
autostart=true
autorestart=true
stdout_logfile=/var/log/hvnb/uvicorn.log
stderr_logfile=/var/log/hvnb/uvicorn.err.log
environment=PYTHONPATH="/opt/app/backend",OPENSSL_CONF="/etc/hvnb/openssl-legacy.cnf"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/hvnb/nginx.log
stderr_logfile=/var/log/hvnb/nginx.err.log
