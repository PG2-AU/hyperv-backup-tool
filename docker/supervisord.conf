[supervisord]
nodaemon=true
logfile=/var/log/hvnb/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:uvicorn]
directory=/opt/app/backend
command=python3 -m uvicorn app.main:app --host 127.0.0.1 --port 8000
autostart=true
autorestart=true
stdout_logfile=/var/log/hvnb/uvicorn.log
stderr_logfile=/var/log/hvnb/uvicorn.err.log
environment=PYTHONPATH="/opt/app/backend"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/hvnb/nginx.log
stderr_logfile=/var/log/hvnb/nginx.err.log

[program:updater]
command=/usr/local/bin/updater.sh
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/hvnb/updater.log
stderr_logfile=/var/log/hvnb/updater.err.log
