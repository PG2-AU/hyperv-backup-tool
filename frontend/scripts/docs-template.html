<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #eef0ee;
    --surface: #ffffff;
    --ink: #161a17;
    --ink-muted: #5c645d;
    --border: #d7dbd5;
    --accent: #2f6d4f;
    --accent-ink: #17402c;
    --accent-soft: #e2efe7;
    --warn: #a15a1f;
    --warn-soft: #f6ead9;
    --code-bg: #14181a;
    --code-ink: #e9ede9;
    --code-accent: #7fd1a8;
    --sidebar-w: 262px;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --surface: #1b1e22;
      --ink: #e9ebe6;
      --ink-muted: #9ba39a;
      --border: #33373a;
      --accent: #6fcf9b;
      --accent-ink: #bdeed2;
      --accent-soft: #1e2f27;
      --warn: #e0a862;
      --warn-soft: #332a1c;
      --code-bg: #0e1011;
      --code-ink: #e9ede9;
      --code-accent: #7fd1a8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --surface: #1b1e22;
    --ink: #e9ebe6;
    --ink-muted: #9ba39a;
    --border: #33373a;
    --accent: #6fcf9b;
    --accent-ink: #bdeed2;
    --accent-soft: #1e2f27;
    --warn: #e0a862;
    --warn-soft: #332a1c;
    --code-bg: #0e1011;
    --code-ink: #e9ede9;
    --code-accent: #7fd1a8;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15.5px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-ink); }

  .shell {
    display: flex;
    max-width: 1240px;
    margin: 0 auto;
    align-items: flex-start;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    padding: 28px 18px 40px 28px;
    border-right: 1px solid var(--border);
  }
  .sidebar-brand {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 22px;
  }
  .sidebar nav a {
    display: block;
    text-decoration: none;
    color: var(--ink);
    font-size: 13.5px;
    padding: 6px 10px;
    border-radius: 5px;
    margin-bottom: 1px;
  }
  .sidebar nav a:hover { background: var(--accent-soft); }
  .sidebar nav .num {
    font-family: var(--font-mono);
    color: var(--accent-ink);
    font-weight: 600;
    margin-right: 7px;
  }
  .sidebar nav .group-label {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    margin: 18px 0 4px 10px;
  }

  /* ---------- Main ---------- */
  main {
    flex: 1;
    min-width: 0;
    padding: 48px 56px 80px;
  }
  .doc-header { margin-bottom: 40px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-ink);
    font-weight: 600;
  }
  h1 {
    font-family: var(--font-mono);
    font-size: clamp(1.7rem, 2.6vw, 2.3rem);
    font-weight: 700;
    margin: 10px 0 14px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .doc-header p {
    color: var(--ink-muted);
    max-width: 62ch;
    font-size: 16px;
  }

  section { margin-bottom: 52px; }
  h2 {
    font-family: var(--font-mono);
    font-size: 1.28rem;
    font-weight: 600;
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 10px;
    margin: 0 0 18px;
    border-bottom: 1px solid var(--border);
    scroll-margin-top: 20px;
  }
  h2 .step-num {
    font-size: 0.85em;
    color: var(--accent-ink);
    background: var(--accent-soft);
    border-radius: 5px;
    padding: 1px 8px;
  }
  h3 {
    font-family: var(--font-mono);
    font-size: 1.02rem;
    font-weight: 600;
    margin: 28px 0 10px;
    scroll-margin-top: 20px;
  }
  p { max-width: 72ch; }
  ul, ol { max-width: 72ch; padding-left: 1.3em; }
  li { margin-bottom: 5px; }
  li input[type="checkbox"] { margin-right: 6px; }
  strong { font-weight: 600; }
  code:not(pre code) {
    font-family: var(--font-mono);
    background: var(--accent-soft);
    color: var(--accent-ink);
    padding: 0.1em 0.4em;
    border-radius: 4px;
    font-size: 0.87em;
  }

  /* ---------- Architecture cards ---------- */
  .arch-note {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin: 20px 0;
  }
  .proc-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 18px 0 20px;
  }
  .proc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .proc-card .name {
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--accent-ink);
    font-size: 0.92rem;
  }
  .proc-card .desc {
    font-size: 0.86rem;
    color: var(--ink-muted);
    margin-top: 4px;
  }
  @media (max-width: 760px) {
    .proc-row { grid-template-columns: 1fr; }
  }

  /* ---------- Code blocks ---------- */
  .code-block {
    position: relative;
    background: var(--code-bg);
    color: var(--code-ink);
    border-radius: 10px;
    margin: 14px 0 18px;
    overflow-x: auto;
    max-width: 100%;
  }
  .code-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--code-accent);
    padding: 9px 16px 0;
    display: block;
  }
  .code-block pre {
    margin: 0;
    padding: 6px 16px 16px;
    overflow-x: auto;
  }
  .code-block code {
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    white-space: pre;
  }

  /* ---------- Callouts ---------- */
  .callout {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 8px 8px 0;
    padding: 12px 18px;
    margin: 16px 0;
    max-width: 72ch;
    font-size: 14.5px;
  }
  .callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }
  .callout p { margin: 0; max-width: none; }
  .callout .callout-label {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 4px;
    color: var(--accent-ink);
  }
  .callout.warn .callout-label { color: var(--warn); }

  /* ---------- Table ---------- */
  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 100%;
    margin: 14px 0;
    font-size: 14px;
    display: block;
    overflow-x: auto;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 9px 12px;
    text-align: left;
    vertical-align: top;
  }
  th {
    background: var(--surface);
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-muted);
  }

  footer {
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--ink-muted);
    font-size: 13px;
    max-width: 72ch;
  }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    main { padding: 32px 24px 60px; }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">Hyper-V NetApp Backup</div>
    <nav>
{{NAV}}
    </nav>
  </aside>

  <main>
    <div class="doc-header">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1>{{TITLE}}</h1>
{{INTRO}}
    </div>

{{BODY}}
    <footer>
      Feldprotokoll der ursprünglichen Ersteinrichtung (inkl. umgebungsspezifischer Details wie konkreter IPs
      und VLAN-Segmentierung): <code>docs/INSTALL.md</code> im Repository.
    </footer>
  </main>
</div>
</body>
</html>
