services:
  hvnb-backup:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: hyperv-netapp-backup:local
    container_name: hvnb-backup
    restart: unless-stopped
    # network_mode: host statt Port-Mapping: der VHDX-Restore-Workflow
    # meldet sich per iSCSI direkt vom Container aus an (siehe Settings >
    # Restore-Setup). Der WSL2-Kernel dieser Umgebung crasht iscsid beim
    # Session-Aufbau (Netlink kcreate_session) innerhalb eines privaten
    # Bridge-Netzwerk-Namespace ("sendmsg: bug? ctrl_fd") -- live per nsenter
    # verifiziert, dass derselbe Login im Host-Netzwerk-Namespace
    # klaglos funktioniert. nginx lauscht dafuer direkt auf Port 8443
    # (siehe docker/nginx.conf.template), kein Port-Mapping noetig/moeglich.
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      # Fuer das Anlegen fehlender /dev-Geraeteknoten der per iSCSI
      # erscheinenden LUN (Container nutzt tmpfs statt devtmpfs fuer /dev,
      # daher kein automatisches Node-Erstellen durch den Kernel/udev) --
      # ohne diese Capability schlaegt mknod() fuer Blockgeraete mit
      # 'Operation not permitted' fehl, gegen echten Container verifiziert.
      - MKNOD
    devices:
      - /dev/fuse
    device_cgroup_rules:
      - "b 8:* rmw"
    env_file:
      - .env
    environment:
      HVNB_DATABASE_URL: sqlite:////data/app.db
    volumes:
      - hvnb-data:/data
      - hvnb-certs:/etc/hvnb/certs
      # Fuer eigene, von einer internen CA ausgestellte Zertifikate statt
      # der obigen Named-Volume-Zeile z.B. bind-mounten:
      # - ./certs:/etc/hvnb/certs

volumes:
  hvnb-data:
  hvnb-certs:
